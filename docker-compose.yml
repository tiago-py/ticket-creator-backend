services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ticket_creator
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d ticket_creator']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/ticket_creator?schema=public
      JWT_SECRET: local-development-secret-with-32-characters
      CORS_ORIGIN: http://localhost:5173
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
volumes: { postgres_data: {} }
